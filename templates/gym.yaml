# ジムのテンプレート。content/gym/<slug>.yaml にコピーして使う
slug: gym-slug                  # ローマ字。ファイル名と同じにする
name: ジムの名前（店舗名まで）
nameKana: なまえ
kind: パーソナルジム              # パーソナルジム / 総合フィットネスジム / 24時間ジム / レンタルジム / スタジオ / その他
address:
  prefSlug: tokyo                 # data/areas.ts にある値だけ（なければ先に追加）
  citySlug: setagaya
  line: ○○町1-2-3
  # building: 施設名・階
stations:
  - line: 路線名
    name: 駅名                    # 「駅」は付けない
    walkMin: 5
hours:                            # トレーニングを受けられる時間帯
  - days: [月, 火, 水, 金]        # 月 火 水 木 金 土 日 祝
    open: "10:00"
    close: "20:00"
# hoursNote: 定休日や予約の決まりなど（80字以内）
booking:                          # 1つ以上
  phone: 03-0000-0000
  # url: https://
  # line: https://
features: []                      # 完全個室 / 女性専用 / シャワー / ウェア・タオルの貸し出し / 駐車場 / キッズスペース / 出張トレーニング / オンライン対応 / 英語対応
verifiedAt: 2026-01-10
